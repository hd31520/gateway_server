<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout Client</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="shell checkout-shell">
    <header class="topbar checkout-topbar">
      <div>
        <p class="eyebrow">Merchant checkout</p>
        <h1>Checkout Client</h1>
        <p class="muted">Verify payments with transaction ID and amount.</p>
      </div>
      <a class="button-link secondary" href="/">Dashboard</a>
    </header>

    <section class="checkout-grid">
      <form id="checkoutConfigForm" class="panel">
        <div class="section-title">
          <h2>Gateway</h2>
          <span id="configStatus" class="badge warning">Unsaved</span>
        </div>

        <label for="gatewayEndpoint">Verify endpoint</label>
        <input id="gatewayEndpoint" value="/api/merchant/verify" required />

        <label for="gatewayApiKey">Website API key</label>
        <input id="gatewayApiKey" placeholder="pg_live_..." required />

        <label for="gatewayDomain">Website domain</label>
        <input id="gatewayDomain" placeholder="example.com" required />

        <button type="submit">Save Gateway</button>
        <p id="configMessage" class="notice" aria-live="polite"></p>
      </form>

      <section class="panel checkout-summary">
        <div class="summary-line">
          <span>Order</span>
          <strong id="summaryOrder">ORDER</strong>
        </div>
        <div class="summary-line">
          <span>Amount</span>
          <strong id="summaryAmount">Tk 0.00</strong>
        </div>
        <div class="summary-line">
          <span>Status</span>
          <strong id="summaryStatus">Ready</strong>
        </div>
      </section>
    </section>

    <section class="checkout-grid main-checkout">
      <form id="paymentVerifyForm" class="panel checkout-card">
        <div class="section-title">
          <h2>Payment</h2>
          <span class="badge dark">VERIFY</span>
        </div>

        <label for="orderId">Order ID</label>
        <input id="orderId" required />

        <label for="sellerName">Seller name</label>
        <input id="sellerName" placeholder="Merchant or seller name" />

        <label for="buyerName">Buyer name</label>
        <input id="buyerName" placeholder="Customer name" />

        <label for="buyerPhone">Buyer phone (sender)</label>
        <input id="buyerPhone" placeholder="01XXXXXXXXX" />

        <label for="buyerAddress">Buyer address</label>
        <input id="buyerAddress" placeholder="Customer address" />

        <label for="paymentAmount">Amount</label>
        <input id="paymentAmount" type="number" min="1" step="0.01" value="500" required />

        <label for="transactionId">Transaction ID</label>
        <input id="transactionId" placeholder="Customer TrxID" required />

        <label for="returnUrl">Return URL</label>
        <input id="returnUrl" placeholder="https://shop.example/order-return" />

        <button type="submit">Verify Payment</button>
        <p id="paymentMessage" class="notice" aria-live="polite"></p>
        <button id="startPaymentBtn" type="button" class="button-link tiny-link" style="margin-top:12px;">Start Payment</button>
      </form>

      <section class="panel">
        <div class="section-title">
          <h2>Response</h2>
          <button id="copyPayloadBtn" type="button" class="secondary tiny">Copy</button>
        </div>
        <pre id="checkoutResponse" class="code-block checkout-response"></pre>
      </section>
    </section>
  </main>
  <script src="/checkout.js"></script>
  <script>
  (function(){
    const params = new URLSearchParams(location.search);
    const initialAmount = params.get('amount');
    const callback = params.get('callback');

    const amountInput = document.getElementById('paymentAmount');
    if (initialAmount && amountInput) amountInput.value = initialAmount;

    const startBtn = document.getElementById('startPaymentBtn');
    const buyerPhoneInput = document.getElementById('buyerPhone');
    const responsePre = document.getElementById('checkoutResponse');
    const summaryStatus = document.getElementById('summaryStatus');

    let pollInterval = null;

    startBtn.addEventListener('click', async function(){
      const amount = Number(document.getElementById('paymentAmount').value || 0);
      const buyerPhone = (buyerPhoneInput.value || '').trim();
      if (!buyerPhone) {
        alert('Enter your phone number to receive SMS');
        return;
      }

      summaryStatus.textContent = 'Initiating...';

      try {
        const res = await fetch('/api/payment/gateway/initiate', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ paymentMethod: 'bkash', senderPhone: buyerPhone, receiverPhone: '', amount })
        });
        const data = await res.json();
        responsePre.textContent = JSON.stringify(data, null, 2);
        if (!data.paymentId) {
          summaryStatus.textContent = 'Failed to initiate';
          return;
        }

        summaryStatus.textContent = 'Waiting for verification...';
        const paymentId = data.paymentId;

        // Poll for status
        pollInterval = setInterval(async () => {
          try {
            const s = await fetch(`/api/payment/gateway/status/${paymentId}`);
            if (!s.ok) return;
            const d = await s.json();
            responsePre.textContent = JSON.stringify(d, null, 2);
            if (d.status === 'verified') {
              clearInterval(pollInterval);
              summaryStatus.textContent = 'Verified';
              const msg = { type: 'payment_status', paymentId, status: 'verified', transactionId: d.transactionId, amount: d.amount };
              try { window.opener && window.opener.postMessage(msg, '*'); } catch(e){}
              if (callback) {
                const cb = new URL(callback);
                cb.searchParams.set('paymentId', paymentId);
                cb.searchParams.set('status', 'verified');
                if (d.transactionId) cb.searchParams.set('txn', d.transactionId);
                location.href = cb.toString();
              } else {
                alert('Payment verified — Transaction ID: ' + (d.transactionId || ''));
              }
            } else if (d.status === 'expired' || d.status === 'cancelled') {
              clearInterval(pollInterval);
              summaryStatus.textContent = 'Failed';
              try { window.opener && window.opener.postMessage({ type:'payment_status', paymentId, status:'failed' }, '*'); } catch(e){}
            }
          } catch (e) { console.error(e); }
        }, 2000);
      } catch (e) {
        console.error(e);
        summaryStatus.textContent = 'Error';
      }
    });
  })();
  </script>
</body>
</html>
